name: Проверка изменений Пульта
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Установить версию тестового клиента
        run: npm install --no-save --package-lock=false playwright@1.64.1
      - name: Проверка компоновки и сохранения
        run: node scripts/check-layout.mjs
